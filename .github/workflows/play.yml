# The Google Play release bundle (design doc 9.10, decision 38): an Android
# App Bundle signed with the upload key, built when asked for (Actions, "Play
# release bundle", Run workflow) and kept as this run's artifact for upload
# to the Play Console. It needs four repository secrets:
#   UPLOAD_KEYSTORE_BASE64    the upload keystore, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD  its password
#   UPLOAD_KEY_ALIAS          the key's alias in it
#   UPLOAD_KEY_PASSWORD       the key's password
# Each run numbers its bundle (versionCode), so every upload is newer than
# the last, as Play requires.
name: Play release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown on Play (the run number is added, e.g. 1.0 → 1.0.4)
        default: '1.0'
        required: true

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version }}.${{ github.run_number }}
    steps:
      - name: Check for the upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The upload key's secrets are missing. Add UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD under Settings, Secrets and variables, Actions (store/PLAY.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Core tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Unpack the upload key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Build the signed bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/bundle/release/app-release.aab "rien-ne-va-plus-$VERSION_NAME.aab"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: rien-ne-va-plus-${{ env.VERSION_NAME }}-play
          path: rien-ne-va-plus-*.aab
          retention-days: 7
