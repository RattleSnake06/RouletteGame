# The Android test build (design doc 9.10, Phase 9): on every push, the web
# build wrapped by Capacitor into a debug APK that installs on an Android
# phone with no store and no account. The newest is attached to the "Android
# test build" pre-release; each run also keeps its own as a workflow artifact.
name: Android test build

on:
  push:
    # Words and the site change nothing in the app.
    paths-ignore:
      - 'site/**'
      - 'store/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Core tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "rien-ne-va-plus-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rien-ne-va-plus-${{ env.VERSION_NAME }}
          path: rien-ne-va-plus-*.apk

      - name: Attach it to the "Android test build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test rien-ne-va-plus-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build $VERSION_NAME" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On an Android phone: download the .apk below, open it, and allow your browser to install apps when asked. A newer build installs over this one and keeps your saves."
